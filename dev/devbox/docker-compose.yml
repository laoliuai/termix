services:
  devbox:
    build:
      context: .
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
        APT_MIRROR: ${APT_MIRROR:-archive.ubuntu.com}
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
    image: ai-devbox:latest
    container_name: ai-devbox
    env_file: .env
    # Map host.docker.internal to the host's gateway IP so HTTP_PROXY in .env
    # can reach a proxy bound to the host's loopback (e.g. Clash on 7897).
    # Linux requires this explicit mapping; on Docker Desktop it is auto-set.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${WORKSPACE_DIR:-../..}:/workspace:rw
      - devbox-claude-home:/home/dev/.claude
      - devbox-codex-home:/home/dev/.codex
      - devbox-opencode-home:/home/dev/.config/opencode
      - devbox-shell-history:/home/dev/.history
      - devbox-go-cache:/home/dev/go
    working_dir: /workspace
    command: ["sleep", "infinity"]
    tty: true
    stdin_open: true

volumes:
  devbox-claude-home:
  devbox-codex-home:
  devbox-opencode-home:
  devbox-shell-history:
  devbox-go-cache:
